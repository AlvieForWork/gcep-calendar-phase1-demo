<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R866 行事曆 — 資訊卡與清單視窗定位原型</title>
<style>
  /* ────────────────────────────────────────────────────────────
     規則來源：SRS 3.12（資訊卡）／3.13（清單視窗）
     Figma：Parking 頁 section「資訊卡 / 清單 位置」node 9789:249848
     這支原型只驗證浮層定位，沒有行事曆的其他功能。
     ──────────────────────────────────────────────────────────── */
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px 16px 40px;
    background: #eef1f5;
    font-family: "PingFang TC", "Noto Sans TC", sans-serif;
    color: #373737;
  }

  /* ─── 控制列（原型專用，不是產品畫面） ─── */
  .bar { background: #111827; color: #e5e7eb; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 12px; line-height: 1.8; }
  .bar h1 { margin: 0 0 6px; font-size: 13px; color: #93c5fd; }
  .bar .row { display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .bar b { color: #fcd34d; font-weight: 600; }
  .bar .step { color: #86efac; font-weight: 600; }
  .bar .warn { color: #fca5a5; }
  .bar .hint { color: #9ca3af; }
  .ctl { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid #374151; }
  .ctl .grp { display: flex; gap: 6px; align-items: center; }
  .ctl button {
    font: inherit; font-size: 12px; color: #e5e7eb; background: #374151;
    border: 1px solid #4b5563; border-radius: 999px; padding: 3px 12px; cursor: pointer;
  }
  .ctl button:hover { background: #4b5563; }
  .ctl button[aria-pressed="true"] { background: #2563eb; border-color: #2563eb; color: #fff; }
  .ctl label { cursor: pointer; }

  /* ─── 模擬應用視窗（可拖寬、可拖高） ─── */
  .win {
    position: relative;
    width: 920px; height: 690px;
    min-width: 456px; min-height: 420px; max-width: 100%;
    resize: both; overflow: hidden;
    background: #3f576a; border-radius: 6px;
  }
  .win::after {
    content: "↘ 拖右下角改視窗大小（最小寬 456）";
    position: absolute; right: 24px; bottom: 3px;
    font-size: 11px; color: rgba(255,255,255,.6); pointer-events: none;
  }

  /* 左側導覽：寬 50、距左 9，不隨視窗縮放 */
  .nav { position: absolute; left: 9px; top: 34px; width: 50px; bottom: 34px; background: rgba(255,255,255,.14); border-radius: 24px; }
  .nav i { display: block; width: 32px; height: 32px; margin: 22px auto 0; background: rgba(194,210,222,.55); border-radius: 8px; }

  /* Main Content：左 71、右 8、上 8、下 8 */
  .main {
    position: absolute; left: 71px; right: 8px; top: 8px; bottom: 8px;
    background: linear-gradient(#fefeff, #eceff6); border-radius: 16px;
    padding: 30px 32px 20px; overflow: hidden;
    display: flex; flex-direction: column; gap: 20px;
  }
  /* 標題列與工具列的高度照稿：標題框 48、間距 20、日期列 36、間距 12、分隔線 1、間距 20
     → 行事曆區從視窗頂端 175 開始（920×833 稿面值），定位結果才會跟稿一致 */
  .head { flex: 0 0 auto; }
  .head h2 { margin: 0; height: 48px; padding: 6px 0; font-size: 24px; line-height: 36px; font-weight: 600; }
  .toolbar { display: flex; align-items: center; gap: 16px; height: 36px; margin-top: 20px; }
  .pill { height: 36px; padding: 0 16px; border: 1px solid #DCDCDC; border-radius: 100px; background: #fff; font-size: 14px; color: #5B5B5B; display: flex; align-items: center; }
  .pill.sel { background: #F5F5F5; border: 0; height: 37px; border-radius: 17px; }
  .divider { height: 1px; background: #EBEBEB; margin-top: 12px; }
  .cal { position: relative; flex: 1; min-height: 0; }

  /* ─── 月視圖 ─── */
  .m-grid { display: flex; flex-direction: column; height: 100%; border: 1px solid #DCDCDC; border-radius: 8px; overflow: hidden; }
  .m-head { display: grid; grid-template-columns: repeat(7, 1fr); flex: 0 0 32px; }
  .m-head span { display: grid; place-items: center; font-size: 14px; font-weight: 500; color: #919191; background: #fff; border-left: 1px solid #DCDCDC; }
  .m-head span:first-child { border-left: 0; }
  .m-body { flex: 1; min-height: 0; overflow: auto; }
  .m-row { display: grid; grid-template-columns: repeat(7, 1fr); }
  .m-cell { height: 100px; background: #fff; border-top: 1px solid #DCDCDC; border-left: 1px solid #DCDCDC; padding: 7px 6px 8px; position: relative; cursor: default; }
  .m-cell:first-child { border-left: 0; }
  .m-cell.today { background: #FCF8E3; }
  .m-cell .d { font-size: 12px; font-weight: 500; text-align: center; color: #373737; }
  .m-cell .evs { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }

  /* ─── 週／天視圖 ─── */
  .tg { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto 1fr; height: 100%; position: relative; }
  .tg-box { grid-column: 2; grid-row: 1 / 4; display: grid; grid-template-rows: subgrid; border: 1px solid #DCDCDC; border-radius: 8px; overflow: hidden; }
  .tg-head { display: grid; }
  .tg-head .c { border-left: 1px solid #DCDCDC; background: #fff; padding: 6px 0; text-align: center; }
  .tg-head .c:first-child { border-left: 0; }
  .tg-head .wd { display: block; font-size: 13px; font-weight: 600; color: #919191; }
  .tg-head .dn { display: block; margin-top: 8px; font-size: 14px; font-weight: 500; }
  .tg-allday { display: grid; }
  .tg-allday .c { border-left: 1px solid #DCDCDC; border-top: 1px solid #DCDCDC; background: #fff; min-height: 43px; padding: 2px; display: flex; flex-direction: column; gap: 2px; }
  .tg-allday .c:first-child { border-left: 0; }
  .tg-body { overflow-y: auto; }
  .tg-rows { display: grid; }
  .tg-slotrow { display: grid; }
  .tg-slot { height: 44px; border-left: 1px solid #DCDCDC; border-top: 1px solid #DCDCDC; background: #fff; padding: 2px; display: flex; gap: 0; }
  .tg-slot:first-child { border-left: 0; }
  .tg-axis { grid-column: 1; }
  .tg-axis .lab { height: 44px; font-size: 12px; font-weight: 500; color: #373737; padding-top: 2px; }
  .tg-axis .allday-lab { min-height: 43px; font-size: 12px; font-weight: 500; }
  .tg-axis-scroll { overflow: hidden; }
  .today-col { background: #FCF8E3 !important; }

  /* ─── 行程卡 ─── */
  .ev {
    background: #FF6416; color: #fff; border-radius: 4px; padding: 2px 4px;
    font-size: 12px; line-height: 16px; font-weight: 500; height: 20px;
    white-space: nowrap; overflow: hidden; cursor: pointer; border: 0; text-align: left; width: 100%;
  }
  .ev.slot { height: 100%; }
  .ev:hover { box-shadow: inset 0 0 0 100px rgba(0,0,0,.1); }
  .more { background: none; border: 0; padding: 2px 4px; border-radius: 4px; font: inherit; font-size: 12px; font-weight: 500; line-height: 16px; color: #7F7F7F; text-align: left; cursor: pointer; height: 20px; }
  .more:hover { background: #F5F5F5; }
  .plus { flex: 0 0 23px; background: #fff; border: 0; border-radius: 4px; font-size: 12px; font-weight: 500; color: #7F7F7F; cursor: pointer; }

  /* ─── 活動資訊卡（400 寬，SRS 3.12） ─── */
  .card {
    position: absolute; z-index: 40; width: 400px; max-height: 90vh;
    display: flex; flex-direction: column;
    background: #fff; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.22); overflow: hidden;
  }
  .card-head { flex: 0 0 42px; display: flex; align-items: center; background: #F5F5F5; padding: 9px 16px; font-size: 16px; color: #5B5B5B; }
  .card-head .acts { margin-left: auto; display: flex; gap: 24px; color: #7F7F7F; }
  .card-head button { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 0; }
  .card-body { overflow-y: auto; padding: 8px 16px 12px; }
  .row { display: flex; gap: 12px; padding: 12px 8px; font-size: 16px; line-height: 24px; }
  .row .ic { flex: 0 0 20px; color: #5B5B5B; font-size: 14px; }
  .row .sub { font-size: 12px; line-height: 17px; color: #919191; }
  .card h3 { margin: 0; font-size: 18px; line-height: 27px; font-weight: 600; }
  .sq { width: 12px; height: 12px; border-radius: 2px; background: #FF6416; margin-top: 8px; }
  .who { display: flex; align-items: center; gap: 8px; padding: 12px 0; }
  .who .pic { width: 30px; height: 30px; border-radius: 50%; background: #DCDCDC; flex: 0 0 30px; }
  .rsvp { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 16px; border-top: 1px solid #DCDCDC; }
  .rsvp .q { flex: 1; font-size: 16px; }
  .rsvp button { min-width: 74px; height: 32px; border: 1px solid #DCDCDC; border-radius: 100px; background: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .rsvp button.on { background: #FF8A4F; border-color: #FF8A4F; color: #fff; }

  /* ─── 當日完整行程清單（260 寬，SRS 3.13） ─── */
  .list {
    position: absolute; z-index: 40; width: 260px; max-height: 314px;
    display: flex; flex-direction: column;
    background: #fff; border: 1px solid #EBEBEB; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.2); overflow: hidden;
  }
  .list-head { flex: 0 0 40px; background: #F5F5F5; padding: 8px 16px; font-size: 16px; color: #5B5B5B; display: flex; align-items: center; }
  .list-head button { margin-left: auto; border: 0; background: none; font: inherit; color: #7F7F7F; cursor: pointer; }
  .list-body { overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .list-body .ev { height: 24px; font-size: 14px; line-height: 20px; }

  /* ─── 定位邊界示意（可開關） ─── */
  .guides { position: absolute; inset: 0; pointer-events: none; z-index: 60; }
  .guides i { position: absolute; background: rgba(37,99,235,.55); }
  .guides i.v { width: 1px; top: 0; bottom: 0; }
  .guides i.h { height: 1px; left: 0; right: 0; }
  .guides span { position: absolute; font-size: 10px; color: #2563eb; background: rgba(255,255,255,.85); padding: 0 3px; border-radius: 2px; }
</style>
</head>
<body>

<div class="bar">
  <h1>資訊卡與清單視窗定位原型（SRS 3.12／3.13）</h1>
  <div class="row" id="dbg"><span class="hint">點行程卡開資訊卡、點「還有 N 個」或「+N」開清單視窗。</span></div>
  <div class="ctl">
    <span class="grp">視圖：
      <button data-view="month" aria-pressed="true">月</button>
      <button data-view="week" aria-pressed="false">週</button>
      <button data-view="day" aria-pressed="false">天</button>
    </span>
    <span class="grp">判斷「左邊放不放得下」用哪條線：
      <button data-edge="content" aria-pressed="true">乙 內容區左緣（71）</button>
      <button data-edge="window" aria-pressed="false">甲 視窗左緣（0）</button>
    </span>
    <span class="grp">從清單點一筆時，卡片貼：
      <button data-ref="cell" aria-pressed="true">原本的格子</button>
      <button data-ref="list" aria-pressed="false">清單視窗（SRS 3.13 現行文字）</button>
    </span>
    <span class="grp">
      <button data-toggle="guides" aria-pressed="false">顯示定位邊界</button>
      <button data-toggle="tall" aria-pressed="false">長內容卡片</button>
    </span>
    <span class="hint">※ 保證完整顯示時的左邊界一律是視窗左緣（SRS 3.12 定案），開關只影響第 1、2 步的判斷。</span>
  </div>
</div>

<div class="win" id="win">
  <div class="nav"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="main" id="main">
    <div class="head">
      <h2>行事曆</h2>
      <div class="toolbar">
        <span class="pill">今天</span><span class="pill">‹</span><span class="pill">›</span>
        <span class="pill">2026/09</span><span class="pill sel" id="viewLabel">月 ⌄</span>
      </div>
      <div class="divider"></div>
    </div>
    <div class="cal" id="cal"></div>
  </div>
  <div class="guides" id="guides" hidden></div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const win = $('win'), main = $('main'), cal = $('cal');
  const CARD_W = 400, LIST_W = 260;
  const WD = ['日', '一', '二', '三', '四', '五', '六'];

  const state = { view: 'month', edge: 'content', ref: 'cell', guides: false, tall: false, card: null, list: null, last: null };

  /* ══════════════ 假資料（寫死） ══════════════ */
  const EV = t => ({ t });
  const monthEvents = {            // 欄 index → 行程
    0: ['09:00 設計師會議'], 1: ['10:00 週例會'], 2: ['11:00 產品同步'],
    3: ['09:00 設計師會議', '11:00 設計審查', '14:00 客戶簡報', '15:00 週報', '16:00 面談', '17:00 結帳'],
    4: ['13:00 行銷會議'], 5: ['10:00 業務會議'], 6: ['09:00 值班'],
  };

  /* ══════════════ 定位引擎（SRS 3.12／3.13 共用） ══════════════ */
  function bounds() {
    const w = win.getBoundingClientRect(), m = main.getBoundingClientRect();
    return {                                   // 全部轉成「相對模擬視窗」的座標
      left: 0,                                 // 左＝視窗左緣（卡片可蓋過左側導覽）
      right: m.right - w.left,                 // 右＝Main Content 右邊界
      top: m.top - w.top,                      // 上＝內容區上邊界
      bottom: m.bottom - w.top,                // 下＝內容區下邊界
      contentLeft: m.left - w.left,            // 內容區左緣（＝判斷用的「乙」）
    };
  }
  function rectOf(el) {
    const w = win.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { left: r.left - w.left, right: r.right - w.left, top: r.top - w.top, bottom: r.bottom - w.top, w: r.width, h: r.height };
  }

  /**
   * 依 SRS 3.12 的五個步驟算浮層位置。
   * target：參考對象（月＝日期格、週／天＝時間格、全天列＝「還有 N 個」按鈕、清單開卡片＝清單視窗）
   */
  function place(target, W, H) {
    const b = bounds();
    const judgeLeftEdge = state.edge === 'window' ? b.left : b.contentLeft;   // 未定參數：判斷第 2 步用哪條線
    const spaceRight = b.right - target.right;
    const spaceLeft = target.left - judgeLeftEdge;
    const spaceAbove = target.top - b.top;
    const spaceBelow = b.bottom - target.bottom;

    let left, top, step;
    if (spaceRight >= W) {                       // 1
      step = 1; left = target.right; top = target.top + target.h / 2 - H / 2;
    } else if (spaceLeft >= W) {                 // 2
      step = 2; left = target.left - W; top = target.top + target.h / 2 - H / 2;
    } else if (spaceAbove >= H) {                // 3
      step = 3; left = target.left; top = target.top - H;
    } else if (spaceBelow >= H) {                // 4
      step = 4; left = target.left; top = target.bottom;
    } else {                                     // 5
      step = 5; left = b.right - W; top = target.top + target.h / 2 - H / 2;
    }

    /* 保證完整顯示：任何一邊超出定位邊界就往內推（左邊界一律用視窗左緣） */
    const pushed = [];
    if (left + W > b.right) { left = b.right - W; pushed.push('右'); }
    if (left < b.left) { left = b.left; pushed.push('左'); }
    if (top + H > b.bottom) { top = b.bottom - H; pushed.push('下'); }
    if (top < b.top) { top = b.top; pushed.push('上'); }

    return { left: Math.round(left), top: Math.round(top), step, pushed,
      space: { right: Math.round(spaceRight), left: Math.round(spaceLeft), above: Math.round(spaceAbove), below: Math.round(spaceBelow) },
      b, W, H };
  }

  /* ══════════════ 浮層 ══════════════ */
  function closeCard() { if (state.card) { state.card.remove(); state.card = null; } }
  function closeList() { if (state.list) { state.list.remove(); state.list = null; } }

  function cardHTML(title, date) {
    const people = [['Johanna White', '主辦人'], ['Lily', ''], ['Amy Brown', '']];
    const extra = state.tall
      ? `<div class="row"><span class="ic">▤</span><span>這是一張內容很長的活動資訊卡，用來測試上下放不下時會走到第幾步。
           參與人多、備註長的活動就會是這個高度。備註：會議前請先看過 SRS 第 3 節與第 5 節，
           會議中只處理有爭議的部分。若無法出席，請於前一天回覆並指派代理人。</span></div>`
      : '';
    return `<div class="card-head">活動資訊<span class="acts"><button>⋯</button><button data-close>✕</button></span></div>
      <div class="card-body">
        <div class="row"><span class="sq"></span><h3>${title}</h3></div>
        <div class="row"><span class="ic">◷</span><span>${date}　|　09:00 – 10:00</span></div>
        <div class="row"><span class="ic">◎</span><span>竹北二廠</span></div>
        <div class="row"><span class="ic">◍</span><span style="flex:1">參與人<div class="sub">1人接受、1人婉拒、1人未回覆</div>
          ${people.map(([n, r]) => `<div class="who"><span class="pic"></span><span>${n}${r ? `<div class="sub">${r}</div>` : ''}</span></div>`).join('')}
        </span></div>
        <div class="row"><span class="ic">▤</span><span>請攜帶筆電</span></div>
        ${extra}
        <div class="row"><span class="ic">▦</span><span>Emma Tylor<div class="sub">建立者：Emma Tylor</div></span></div>
      </div>
      <div class="rsvp"><span class="q">是否參加？</span>
        <button class="on">是</button><button>否</button><button>不確定</button></div>`;
  }

  const asRect = t => (t instanceof Element ? rectOf(t) : t);

  /** 開資訊卡。target＝參考對象（格子元素，或清單視窗的矩形） */
  function openCard(target, title, date, from) {
    closeCard(); closeList();
    const targetRect = asRect(target);
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = cardHTML(title, date);
    el.style.visibility = 'hidden';
    win.appendChild(el);
    const H = el.offsetHeight;                        // 高度隨內容，量完再定位
    const p = place(targetRect, CARD_W, H);
    el.style.left = p.left + 'px'; el.style.top = p.top + 'px'; el.style.visibility = '';
    el.querySelector('[data-close]').onclick = () => { closeCard(); state.last = null; report(null); };
    state.card = el;
    report({ kind: '資訊卡', from, p, target, title, date });
  }

  /** 開清單視窗。target＝觸發元素（日期格／時間格／「還有 N 個」按鈕） */
  function openList(target, date, items, fromLabel) {
    closeCard(); closeList();
    const targetRect = asRect(target);
    const el = document.createElement('div');
    el.className = 'list';
    el.innerHTML = `<div class="list-head">${date}<button data-close>✕</button></div>
      <div class="list-body">${items.map(t => `<button class="ev">${t}</button>`).join('')}</div>`;
    el.style.visibility = 'hidden';
    win.appendChild(el);
    const H = el.offsetHeight;
    const p = place(targetRect, LIST_W, H);
    el.style.left = p.left + 'px'; el.style.top = p.top + 'px'; el.style.visibility = '';
    el.querySelector('[data-close]').onclick = () => { closeList(); state.last = null; report(null); };
    el.querySelectorAll('.ev').forEach((b, i) => {
      b.onclick = () => {                              // 點清單裡的一筆 → 清單關閉
        const listRect = rectOf(el);
        closeList();
        if (state.ref === 'list') openCard(listRect, items[i], date, '清單視窗');
        else openCard(target, items[i], date, '原本的格子');   // 2026-09-21 Alvie：貼回格子
      };
    });
    state.list = el;
    report({ kind: '清單視窗', from: fromLabel, p, target, date, items });
  }

  /* ══════════════ 除錯列 ══════════════ */
  const STEP_TEXT = {
    1: '① 右邊放得下 → 貼參考對象右緣',
    2: '② 左邊放得下 → 貼參考對象左緣',
    3: '③ 上面放得下 → 放正上方、左緣對齊',
    4: '④ 下面放得下 → 放正下方、左緣對齊',
    5: '⑤ 四邊都放不下 → 貼齊定位邊界右緣',
  };
  function report(info) {
    state.last = info;
    const b = bounds();
    const base = `視窗寬 <b>${Math.round(win.getBoundingClientRect().width)}</b>` +
      ` 內容區 <b>${Math.round(b.contentLeft)}–${Math.round(b.right)}</b>` +
      ` 定位邊界 左<b>${b.left}</b> 右<b>${Math.round(b.right)}</b> 上<b>${Math.round(b.top)}</b> 下<b>${Math.round(b.bottom)}</b>`;
    if (!info) { $('dbg').innerHTML = base + ' <span class="hint">（尚未開啟浮層）</span>'; return; }
    const { p } = info;
    const over = p.pushed.length ? `<span class="warn">往內推：${p.pushed.join('、')}</span>` : '';
    $('dbg').innerHTML = base +
      ` ｜ <b>${info.kind}</b>（參考：${info.from}）` +
      ` 位置 x <b>${p.left}</b> y <b>${p.top}</b> 尺寸 <b>${p.W}×${p.H}</b>` +
      ` 右剩 <b>${p.space.right}</b> 左剩 <b>${p.space.left}</b> 上剩 <b>${p.space.above}</b> 下剩 <b>${p.space.below}</b>` +
      ` <span class="step">${STEP_TEXT[p.step]}</span> ${over}`;
    drawGuides();
  }
  function drawGuides() {
    const g = $('guides');
    g.hidden = !state.guides;
    if (!state.guides) return;
    const b = bounds();
    g.innerHTML =
      `<i class="v" style="left:${b.left}px"></i><span style="left:${b.left + 2}px;top:2px">左 ${b.left}（視窗）</span>` +
      `<i class="v" style="left:${b.right}px"></i><span style="left:${b.right - 92}px;top:2px">右 ${Math.round(b.right)}（內容區）</span>` +
      `<i class="h" style="top:${b.top}px"></i>` +
      `<i class="h" style="top:${b.bottom}px"></i><span style="left:2px;top:${b.bottom - 14}px">下 ${Math.round(b.bottom)}</span>` +
      `<i class="v" style="left:${b.contentLeft}px;background:rgba(37,99,235,.25)"></i>` +
      `<span style="left:${b.contentLeft + 2}px;top:18px">內容區左緣 ${Math.round(b.contentLeft)}</span>`;
  }

  /* ══════════════ 三個視圖 ══════════════ */
  function renderMonth() {
    win.style.height = '690px';                       // 月視圖稿面高度
    const first = new Date(2026, 8, 1);               // 2026/09/01
    const start = new Date(first); start.setDate(1 - first.getDay());   // 該週週日
    const rows = [];
    for (let r = 0; r < 6; r++) {
      let cells = '';
      for (let c = 0; c < 7; c++) {
        const d = new Date(start); d.setDate(start.getDate() + r * 7 + c);
        const day = d.getDate(), other = d.getMonth() !== 8;
        const isTarget = r === 2;                     // 第 3 列放行程，方便逐欄點
        const list = isTarget ? (monthEvents[c] || []) : (r === 4 && c === 3 ? ['09:00 季度會議'] : []);
        const shown = list.slice(0, 2), hidden = list.length - shown.length;
        const ymd = `2026/09/${String(day).padStart(2, '0')}`;
        cells += `<div class="m-cell ${r === 2 && c === 1 ? 'today' : ''}" data-col="${c}" data-row="${r}" data-date="${ymd}">
            <div class="d" style="${other ? 'color:#919191' : ''}">${day}</div>
            <div class="evs">
              ${shown.map(t => `<button class="ev" data-ev="${t}">${t}</button>`).join('')}
              ${hidden > 0 ? `<button class="more" data-more="${list.join('|')}">還有${hidden}個</button>` : ''}
            </div></div>`;
      }
      rows.push(`<div class="m-row">${cells}</div>`);
    }
    cal.innerHTML = `<div class="m-grid">
        <div class="m-head">${WD.map(w => `<span>${w}</span>`).join('')}</div>
        <div class="m-body">${rows.join('')}</div>
      </div>`;
  }

  function renderTime(days) {
    win.style.height = '833px';                       // 週／天視圖稿面高度
    const cols = `grid-template-columns: repeat(${days}, 1fr)`;
    let head = '', allday = '', rows = '';
    for (let c = 0; c < days; c++) {
      const today = days === 7 ? c === 1 : true;
      head += `<div class="c ${today ? 'today-col' : ''}"><span class="wd">${WD[days === 7 ? c : 1]}</span><span class="dn">${days === 7 ? 20 + c : 21}</span></div>`;
      /* 全天列的測試資料只放週視圖第 4 欄；天視圖維持空的全天列（與稿一致） */
      const adList = (days === 7 && c === 3) ? ['新人教育訓練', '資安稽核日', '員工健檢'] : [];
      const adShown = adList.slice(0, 2), adHidden = adList.length - adShown.length;
      allday += `<div class="c ${today ? 'today-col' : ''}" data-col="${c}">
          ${adShown.map(t => `<button class="ev" data-ev="${t}">${t}</button>`).join('')}
          ${adHidden > 0 ? `<button class="more" data-more="${adList.join('|')}" data-trigger="self">還有${adHidden}個</button>` : ''}
        </div>`;
    }
    for (let h = 0; h < 24; h++) {
      let slots = '';
      for (let c = 0; c < days; c++) {
        const today = days === 7 ? c === 1 : true;
        let inner = '';
        /* 每一欄都放早上與下午各一筆：早上的上方空間小（多半走第 5 步），
           下午的上方空間大（可能走第 3 步），兩種都能測 */
        if (h === 9) inner = `<button class="ev slot" data-ev="09:00 設計師會議">09:00 設計師會議</button>`;
        if (h === 14) inner = `<button class="ev slot" data-ev="14:00 週例會">14:00 週例會</button>`;
        if (h === 11 && (c === 2 || days === 1)) {                    // 同時段多筆 → +N
          const many = ['11:00 週會', '11:00 設計審查', '11:00 客戶簡報', '11:00 週報', '11:00 面談', '11:00 結帳', '11:00 對焦', '11:00 同步'];
          inner = many.slice(0, 5).map(t => `<button class="ev slot" data-ev="${t}" style="flex:1 1 0;min-width:0;margin-left:-24px">${t}</button>`).join('') +
            `<button class="plus" data-more="${many.join('|')}">+3</button>`;
        }
        slots += `<div class="tg-slot ${today ? 'today-col' : ''}" data-col="${c}" data-hour="${h}">${inner}</div>`;
      }
      rows += `<div class="tg-slotrow" style="${cols}">${slots}</div>`;
    }
    cal.innerHTML = `<div class="tg">
        <div class="tg-axis" style="grid-row:2"><div class="allday-lab">全天</div></div>
        <div class="tg-axis tg-axis-scroll" style="grid-row:3">
          <div id="axis">${Array.from({ length: 24 }, (_, h) => `<div class="lab">${String(h).padStart(2, '0')}:00</div>`).join('')}</div>
        </div>
        <div class="tg-box">
          <div class="tg-head" style="${cols}">${head}</div>
          <div class="tg-allday" style="${cols}">${allday}</div>
          <div class="tg-body" id="tgBody"><div class="tg-rows">${rows}</div></div>
        </div>
      </div>`;
    const body = $('tgBody'), axis = $('axis');
    body.scrollTop = 6 * 44;                          // 進畫面捲到 06:00
    axis.style.transform = `translateY(${-body.scrollTop}px)`;
    body.onscroll = () => { axis.style.transform = `translateY(${-body.scrollTop}px)`; };
  }

  function render() {
    closeCard(); closeList();
    if (state.view === 'month') renderMonth();
    else renderTime(state.view === 'week' ? 7 : 1);
    $('viewLabel').textContent = (state.view === 'month' ? '月' : state.view === 'week' ? '週' : '天') + ' ⌄';
    report(null);
  }

  /* ══════════════ 互動 ══════════════ */
  cal.addEventListener('click', e => {
    const moreBtn = e.target.closest('[data-more]');
    if (moreBtn) {
      const items = moreBtn.dataset.more.split('|');
      /* 觸發元素：月視圖與時間格用「格子」，全天列用「還有 N 個」按鈕本身（SRS 3.13） */
      const self = moreBtn.dataset.trigger === 'self';
      const cell = self ? moreBtn : (moreBtn.closest('.m-cell') || moreBtn.closest('.tg-slot'));
      const label = self ? '全天列的「還有 N 個」按鈕' : (cell.classList.contains('m-cell') ? '日期格' : '時間格');
      openList(cell, cell.dataset.date || '2026/09/21', items, label);
      return;
    }
    const ev = e.target.closest('[data-ev]');
    if (ev) {
      const cell = ev.closest('.m-cell') || ev.closest('.tg-slot') || ev.closest('.tg-allday .c');
      const label = cell.classList.contains('m-cell') ? '日期格' : cell.classList.contains('tg-slot') ? '時間格' : '全天列格子';
      openCard(cell, ev.dataset.ev, cell.dataset.date || '2026/09/21', label);
    }
  });

  document.querySelector('.ctl').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.view) {
      state.view = b.dataset.view;
      document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      render();
    }
    if (b.dataset.edge) {
      state.edge = b.dataset.edge;
      document.querySelectorAll('[data-edge]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      reposition();
    }
    if (b.dataset.ref) {
      state.ref = b.dataset.ref;
      document.querySelectorAll('[data-ref]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    }
    if (b.dataset.toggle === 'guides') { state.guides = !state.guides; b.setAttribute('aria-pressed', String(state.guides)); drawGuides(); }
    if (b.dataset.toggle === 'tall') {
      state.tall = !state.tall; b.setAttribute('aria-pressed', String(state.tall));
      const i = state.last;
      if (state.card && i) openCard(i.target, i.title, i.date, i.from); else reposition();
    }
  });

  /* 拖動視窗、切換判斷線、換長內容時，開著的浮層要即時重算 */
  function reposition() {
    const info = state.last;
    const el = state.card || state.list;
    if (!info || !el) { drawGuides(); report(info || null); return; }
    const W = state.card ? CARD_W : LIST_W;
    const p = place(asRect(info.target), W, el.offsetHeight);
    el.style.left = p.left + 'px'; el.style.top = p.top + 'px';
    report(Object.assign({}, info, { p }));
  }
  new ResizeObserver(() => reposition()).observe(win);

  render();
})();
</script>
</body>
</html>
