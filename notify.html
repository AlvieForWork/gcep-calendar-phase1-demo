<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCEP 行事曆 Phase 1 Demo — #G 通知</title>
<link rel="stylesheet" href="assets/tokens.css?v=202609241746">
<link rel="stylesheet" href="assets/app.css?v=202609241746">
<link rel="stylesheet" href="assets/forms.css?v=202609241746">
<style>
  /* #G02～#G05：通知清單。左側交談列表是 New Messenger 既有畫面，不在行事曆交付範圍，用灰塊示意 */
  .msg-wrap { display: flex; gap: 16px; height: 100%; min-height: 0; }
  .msg-list { flex: 0 0 300px; display: flex; flex-direction: column; gap: 10px; }
  .msg-list .ph { height: 64px; border-radius: 8px; background: #eef1f5; border: 1px dashed #c9ced6; }
  .msg-list .cap { font-size: 12px; color: var(--gray-7f); }
  .msg-body { flex: 1; min-width: 0; display: grid; place-items: center; color: var(--gray-a7); font-size: 14px;
    border-radius: 12px; background: #eef1f5; border: 1px dashed #c9ced6; }

  /* 通知面板（稿上是浮在交談列表上的面板） */
  .noti {
    position: absolute; left: 0; bottom: 0; width: 380px; max-height: 92%;
    display: flex; flex-direction: column;
    background: var(--white); border-radius: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, .22);
    overflow: hidden;
  }
  .noti-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; font-size: 15px; font-weight: 600; color: var(--primary); }
  .noti-head .env { width: 24px; height: 18px; border-radius: 3px; background: var(--primary); }
  .noti-list { overflow-y: auto; }
  .noti-item { display: flex; gap: 12px; padding: 12px 16px; width: 100%; text-align: left; border-top: 1px solid var(--gray-eb); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; font: inherit; }
  .noti-item:hover { background: var(--gray-f5); }
  .noti-item .ic { flex: 0 0 24px; line-height: 0; }
  .noti-item .tx { font-size: 13px; line-height: 1.6; color: var(--gray-37); }
  .noti-item .time { font-size: 12px; color: var(--gray-a7); margin-top: 2px; }
  .noti-item .goto { font-size: 11px; color: var(--primary); margin-top: 4px; }
  .noti-item.only .goto { color: var(--gray-7f); }
  .page-nav { display: flex; gap: 12px; margin-left: auto; font-size: 12px; align-items: center; }
  .page-nav a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>

<div class="shell" id="shell">
  <nav class="nav" id="nav"></nav>

  <main class="main" id="main" data-spec="main">
    <div class="win-ctrl" data-spec="winctrl"><span id="wcMin"></span><span id="wcMax"></span><span id="wcClose"></span></div>

    <header class="head">
      <div class="title-box" style="display:flex;align-items:center;gap:16px;width:100%">
        <h1 class="title">交談</h1>
        <span class="page-nav">
          <a href="app.html">← 回行事曆</a>
          <a href="app.html?g01=1">#G01 提醒提示框</a>
          <a href="mail.html">#H Email 模板 →</a>
        </span>
      </div>
      <div class="divider"></div>
    </header>

    <div class="cal-area">
      <div class="msg-wrap">
        <div class="msg-list">
          <span class="cap">交談列表（New Messenger 既有畫面，非行事曆交付範圍）</span>
          <div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div>
        </div>
        <div class="msg-body">交談內容（非交付範圍）</div>
      </div>

      <!-- #G02～#G05 通知清單 -->
      <div class="noti" data-spec="noti">
        <div class="noti-head"><span class="env"></span>您有 <span id="notiCount">9</span> 則通知</div>
        <div class="noti-list" id="notiList"></div>
      </div>
    </div>
  </main>
</div>

<div class="demobar" id="demobar">
  <span class="db-tag">DEMO</span>
  <span class="db-label">#G 通知與邀請（9 則，文案與導向照「通知規則／通知點擊導向」表）</span>
  <span class="db-sep"></span>
  <span class="db-msg" id="dbMsg">點通知看「點擊導向」規則</span>
</div>

<script src="assets/icons.js?v=202609241746"></script>
<script src="assets/data.js?v=202609241746"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const I = window.ICONS;

  /* 左側導覽列（與行事曆頁共用） */
  const nav = [['wall', I.navWall], ['ann', I.navAnn], ['superhub', I.navSuperhub], ['safesay', I.navSafeSay],
               ['app', I.navAppCenter], ['calendar', I.navCalendar], ['ext', I.navExtension]];
  $('nav').innerHTML = '<div class="user-area"></div>' +
    `<div class="avatar">${I.avatar}</div><div class="online"></div><div class="qr">${I.qr}</div>` +
    `<div class="nav-list">${nav.map(([k, s]) => `<div class="nav-ic ${k}" data-mod="${k}">${s}</div>`).join('')}</div>` +
    `<div class="nav-list bottom"><div class="nav-ic">${I.navNotify}</div><div class="nav-ic">${I.navSettings}</div></div>`;
  $('nav').onclick = e => { if (e.target.closest('.nav-ic.calendar')) location.href = 'app.html'; };
  $('wcMin').innerHTML = I.wcMin; $('wcMax').innerHTML = I.wcMax; $('wcClose').innerHTML = I.wcClose;

  /* 9 則通知：文案、收件人與導向完全照「#G 通知規則 / 通知點擊導向」那張表 */
  const N = [
    { s: 'G02', t: '{主辦人}建立活動「{活動名稱}」，並邀請您參加。', to: '被新增的該位參與人', act: 'card' },
    { s: 'G02', t: '{參與人}已回覆活動「{活動名稱}」邀請：接受。', to: '活動主辦人', act: 'card' },
    { s: 'G03', t: '{參與人}已回覆活動「{活動名稱}」邀請：拒絕。', to: '活動主辦人', act: 'card' },
    { s: 'G03', t: '{參與人}已回覆活動「{活動名稱}」邀請：不確定。', to: '活動主辦人', act: 'card' },
    { s: 'G03', t: '{操作者}變更了活動「{活動名稱}」，{欄位名稱}：{舊值} → {新值}。', to: '所有參與人（含主辦人），操作者除外', act: 'card' },
    { s: 'G03', t: '{操作者}變更了活動「{活動名稱}」，新增 {欄位名稱}：{新值}。', to: '所有參與人（含主辦人），操作者除外', act: 'card' },
    { s: 'G03', t: '{操作者}變更了活動「{活動名稱}」，刪除 {欄位名稱}：{舊值}。', to: '所有參與人（含主辦人），操作者除外', act: 'card' },
    { s: 'G04', t: '活動「{活動名稱}」已取消並從您的行事曆中移除。', to: '所有參與人（含主辦人），操作者除外', act: 'only' },
    { s: 'G05', t: '{操作者}已將您從活動「{活動名稱}」的參與人中移除。', to: '被移除的該位參與人', act: 'only' },
  ];
  const calIcon = I.navCalendarActive.replace('width="32" height="32"', 'width="24" height="24"');
  $('notiCount').textContent = N.length;
  $('notiList').innerHTML = N.map((n, i) => `
    <button class="noti-item ${n.act === 'only' ? 'only' : ''}" data-i="${i}">
      <span class="ic">${calIcon}</span>
      <span><span class="tx">${n.t}</span>
        <div class="time">08/10 上午 11:00 ・ 稿 #${n.s}</div>
        <div class="goto">收件人：${n.to}｜點擊 → ${n.act === 'card' ? '開啟活動資訊卡' : '僅通知，不導向'}</div>
      </span></button>`).join('');

  $('notiList').onclick = e => {
    const b = e.target.closest('.noti-item'); if (!b) return;
    const n = N[+b.dataset.i];
    if (n.act === 'card') {
      $('dbMsg').textContent = `#${n.s}：開啟活動資訊卡 → 轉到行事曆頁`;
      setTimeout(() => location.href = 'app.html?open=info', 400);
    } else {
      $('dbMsg').textContent = `#${n.s}：僅通知，不導向。目標已不存在時通知仍保留在列表中，不自動移除`;
    }
  };
})();
</script>
</body>
</html>
